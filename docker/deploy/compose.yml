name: laravel-reports

# ============================================================
#  laravel-reports doc/demo – production stack
# ============================================================
#  This stack does NOT publish 80/443. It joins the external
#  "edge" network; the existing Caddy reverse proxy (website3)
#  terminates TLS and forwards laravel-reports.private-net.ch
#  to  docs:80.
#
#  The container is stateless on purpose:
#    - SQLite demo DB is baked into the image
#    - sessions/cache live in the container (file driver)
#    - logs go to stderr -> docker logs
#    - PDFs and screenshots are regenerated by pull.sh after each deploy
#
#  No volumes, no host ports, nothing to back up.
# ============================================================

services:
  docs:
    image: ghcr.io/guggach/laravel-reports-doc-demo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Plain HTTP inside the Docker network. The edge proxy owns TLS.
      # No worker mode: see the comment in docker/Dockerfile.
      SERVER_NAME: ":80"

    networks:
      - edge

    # Chromium renders the demo PDFs. Raise this only if the container
    # gets OOM-killed while generating PDFs.
    shm_size: 256mb
    mem_limit: 1500m
    cpus: 1.5
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # For a local smoke test without the reverse proxy, uncomment the port
    # and set SESSION_SECURE_COOKIE=false in .env (the cookie is HTTPS-only
    # in the production defaults).
    # ports:
    #   - "127.0.0.1:8080:80"

networks:
  # Shared with the app container of website3:
  #   docker network create edge
  #   docker network connect edge <website3-app-container>
  edge:
    external: true
